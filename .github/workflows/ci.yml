name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Corepack must be enabled before setup-node so the yarn cache resolves
      # to the Yarn version pinned in package.json's packageManager field.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Lint and format
        run: yarn biome ci .

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test
